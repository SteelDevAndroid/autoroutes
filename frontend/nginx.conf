worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    types {
        application/geo+json   geojson;
        application/vnd.pmtiles pmtiles;
    }
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    gzip on;
    gzip_types application/javascript text/css application/json application/geo+json image/svg+xml;

    # Résolution DNS à la requête : nginx démarre même si le backend n'est pas encore lancé.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self'" always;

        location = /healthz { access_log off; return 204; }

        location = /index.html { add_header Cache-Control "no-cache" always; }

        location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }

        # PMTiles : lecture par requêtes HTTP Range ; pas de gzip (incompatible avec les plages d'octets).
        location /tiles/ {
            gzip off;
            add_header Cache-Control "public, max-age=86400" always;
            add_header Access-Control-Allow-Origin "*" always;
        }

        location /basemaps-assets/ { add_header Cache-Control "public, max-age=604800" always; }

        location /api/v1/stream {
            set $backend http://backend:8080;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # SSE : aucun tampon, connexion longue.
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 1h;
        }

        location /api/ {
            set $backend http://backend:8080;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location / { try_files $uri /index.html; }
    }
}
