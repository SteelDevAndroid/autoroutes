# Pile Docker Hub complète (Docker Compose >= 2.24.4).
# Les définitions communes sont reprises de compose.yaml, sans construction locale.
# Depuis la racine du dépôt :
#   docker compose -f compose.hub.yaml --profile full up -d --wait
#   docker compose -f compose.hub.yaml --profile full --profile monitoring up -d --wait
# Avec .env copié depuis .env.example, le profil full est activé par défaut.
# AUTOROUTES_TAG : latest (version stable), edge (main), ou version publiée.
# Les fichiers locaux de configuration (observability/, auth/) et compose.yaml restent nécessaires.
name: autoroutes
services:
  frontend-live:
    extends:
      file: compose.yaml
      service: frontend-live
    # Évite les doublons extends + surcharge avec Compose 2.x.
    security_opt: !override
      - no-new-privileges:true
    image: compagnonsdudev/autoroutes:frontend-${AUTOROUTES_TAG:-latest}
    build: !reset null
    pull_policy: always
  backend:
    extends:
      file: compose.yaml
      service: backend
    # Évite les doublons extends + surcharge avec Compose 2.x.
    security_opt: !override
      - no-new-privileges:true
    image: compagnonsdudev/autoroutes:backend-${AUTOROUTES_TAG:-latest}
    build: !reset null
    pull_policy: always
  simulator:
    extends:
      file: compose.yaml
      service: simulator
    # Évite les doublons extends + surcharge avec Compose 2.x.
    security_opt: !override
      - no-new-privileges:true
    image: compagnonsdudev/autoroutes:simulator-${AUTOROUTES_TAG:-latest}
    build: !reset null
    pull_policy: always
  mcp-anomalies:
    extends:
      file: compose.yaml
      service: mcp-anomalies
    # Évite les doublons extends + surcharge avec Compose 2.x.
    security_opt: !override
      - no-new-privileges:true
    image: compagnonsdudev/autoroutes:mcp-anomalies-${AUTOROUTES_TAG:-latest}
    build: !reset null
    pull_policy: always
  frontend:
    extends:
      file: compose.yaml
      service: frontend
    # Évite les doublons extends + surcharge avec Compose 2.x.
    security_opt: !override
      - no-new-privileges:true
    image: compagnonsdudev/autoroutes:frontend-demo-${AUTOROUTES_TAG:-latest}
    build: !reset null
    pull_policy: always
  kafka:
    extends:
      file: compose.yaml
      service: kafka
  kafka-init:
    extends:
      file: compose.yaml
      service: kafka-init
  postgres:
    extends:
      file: compose.yaml
      service: postgres
  prometheus:
    extends:
      file: compose.yaml
      service: prometheus
  alertmanager:
    extends:
      file: compose.yaml
      service: alertmanager
  grafana:
    extends:
      file: compose.yaml
      service: grafana
  keycloak:
    extends:
      file: compose.yaml
      service: keycloak
  tiles:
    extends:
      file: compose.yaml
      service: tiles
    image: compagnonsdudev/autoroutes:cartographie-${AUTOROUTES_TAG:-latest}
    build: !reset null
    pull_policy: always
    volumes: !override
      - ./cartographie/out:/repo/cartographie/out
      - ./cartographie/work:/repo/cartographie/work
volumes:
  kafka-data:
  postgres-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
