name: CI

on:
  push:
    branches: [main]
    # Version publiée : git tag v1.2.3 && git push origin v1.2.3 (voir docs/docker.md, « Images publiées »).
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Régénérer les images de référence de la régression visuelle (à télécharger dans les artefacts, relire puis committer)
        type: boolean
        default: false

permissions:
  contents: read

# Une exécution par branche : une poussée annule la précédente, sauf sur main et sur les versions, dont la publication ne doit pas être coupée en route.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Java 25 est la cible du projet (pom.xml) ; Node ≥ 22.22 exigé par jsdom.
  JAVA_VERSION: "25"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.13"

jobs:
  backend:
    name: Backend (unitaires + intégration Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # verify = tests unitaires (surefire, dont la vérification Spring Modulith) puis tests *IT (failsafe, Kafka et PostgreSQL réels).
      - name: mvn verify
        working-directory: backend
        run: mvn -B -ntp verify
      - name: Rapports de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
          retention-days: 7

  simulator:
    name: Simulateur
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: mvn verify
        working-directory: simulator
        run: mvn -B -ntp verify

  mcp:
    name: Serveur MCP des anomalies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      # Client MCP réel (HTTP streamable) contre le serveur, Kafka embarqué ; jeton et rôle exigés en mode sécurisé.
      - name: mvn verify
        working-directory: mcp-anomalies
        run: mvn -B -ntp verify

  frontend:
    name: Frontend (types, lint, tests, build, E2E démonstration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typage strict
        run: npx tsc -b
      - name: Lint (typescript-eslint strictTypeChecked)
        run: npx eslint .
      - name: Tests unitaires
        run: npx vitest run
      # Production sans tuiles : variables vides = fond neutre, sans ressources externes.
      - name: Build de production
        env:
          VITE_BASEMAP_URL: ""
          VITE_MOTORWAYS_URL: ""
          VITE_GLYPHS_URL: ""
          VITE_SPRITE_URL: ""
        run: npm run build
      - name: Build de démonstration
        run: npm run build:demo
      - name: Navigateur Playwright
        run: npx playwright install --with-deps chromium
      # Le serveur de prévisualisation est lancé par playwright.config.ts ; WebGL logiciel (SwiftShader).
      - name: E2E démonstration (rendu réel, erreurs console, accessibilité axe-core)
        run: npx playwright test e2e/demo.spec.ts e2e/anomalies.spec.ts e2e/appearance.spec.ts e2e/search-popover.spec.ts
      - name: E2E itinéraires routiers (frontend de production, API contrôlée)
        run: npm run e2e:routes
      - name: Rapports Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

  visuel:
    name: Régression visuelle (captures de l'interface)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Même image que `npm run e2e:visual:update` (frontend/scripts/visual-docker.mjs) : navigateur, polices et Node identiques partout.
    # Son tag suit la version exacte de @playwright/test (package.json) : les faire évoluer ensemble, sinon Playwright ne trouve pas son navigateur.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - run: npm ci --no-audit --no-fund
      # Captures du panneau, de la légende, des puces et du tiroir (jamais de la carte WebGL), comparées aux références versionnées.
      - name: Comparaison aux références
        if: ${{ !inputs.update_snapshots }}
        run: npx playwright test e2e/visual.spec.ts
      - name: Régénération des références (exécution manuelle)
        if: ${{ inputs.update_snapshots }}
        run: npx playwright test e2e/visual.spec.ts --update-snapshots
      - name: Images de référence régénérées
        if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@v7
        with:
          name: visuel-references
          path: frontend/e2e/visual.spec.ts-snapshots
          retention-days: 7
      - name: Écarts (attendu, obtenu, différence)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visuel-ecarts
          path: frontend/test-results
          retention-days: 7

  cartographie:
    name: Référentiel et chaîne cartographique
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Tests de la préparation des autoroutes
        working-directory: cartographie
        run: python -m unittest -v test_prepare_motorways test_verify_tiles
      # Les fichiers de référentiel versionnés doivent correspondre à ce que produisent les scripts : plus de dérive silencieuse.
      # Seules les colonnes d'identifiants sont comparées pour les coordonnées reprojetées (les derniers chiffres dépendent de la version de PROJ).
      - name: Référentiel à jour
        run: |
          cp referentiel/gares-logiques-proposition.csv /tmp/proposition.avant.csv
          python scripts/analyse_referentiel.py
          git diff --exit-code -- referentiel/alias-gares.csv referentiel/gares-logiques-a-arbitrer.csv
          diff <(cut -d';' -f1-8,12 /tmp/proposition.avant.csv) <(cut -d';' -f1-8,12 referentiel/gares-logiques-proposition.csv)

  observabilite:
    name: Supervision (règles Prometheus, tableau de bord Grafana)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Configuration et règles Prometheus (promtool)
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro" \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Configuration Alertmanager (amtool)
        run: |
          docker run --rm --entrypoint amtool \
            -v "$PWD/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" \
            prom/alertmanager:v0.28.1 check-config /etc/alertmanager/alertmanager.yml
      - name: Tableau de bord à jour (régénéré puis comparé)
        run: |
          python observability/grafana/build_dashboard.py
          git diff --exit-code -- observability/grafana/dashboards

  shell:
    name: Scripts shell (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck cartographie/build.sh scripts/perf_history.sh scripts/fetch_tiles.sh

  carte-images:
    name: Carte embarquée (fond, autoroutes et graphe)
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - name: Place disque pour les données OSM et Protomaps
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v4
      - name: Image de la chaîne cartographique
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cartographie/Dockerfile
          load: true
          tags: autoroutes-cartographie:ci
          cache-from: type=gha,scope=cartographie
          cache-to: type=gha,scope=cartographie,mode=max
      - name: Génération complète de la carte
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e PROTOMAPS_BUILD=latest -e OSM_MODE=single -e BASEMAP_MAXZOOM=12 -e GITHUB_SHA \
            autoroutes-cartographie:ci
      - name: Validation et chemin stable du graphe
        run: |
          set -euo pipefail
          python3 cartographie/verify_tiles.py --out cartographie/out --maxzoom 12
          graph=$(python3 -c 'import json; print(json.load(open("cartographie/out/manifest.json"))["graphe"])')
          sudo cp "cartographie/out/graph/$graph" cartographie/out/graph.json
      - name: Jeu cartographique partagé par les images
        uses: actions/upload-artifact@v7
        with:
          name: carte-images
          path: |
            cartographie/out/tiles
            cartographie/out/basemaps-assets
            cartographie/out/graph.json
            cartographie/out/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  docker:
    name: Images Docker et Compose
    needs: [carte-images]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: carte-images
          path: cartographie/out
      - uses: docker/setup-buildx-action@v4
      - name: Compose valide
        run: |
          cp .env.example .env
          for profile in demo infra full monitoring auth tiles; do docker compose --profile "$profile" config -q; done
          # Surcharge « images publiées » : mêmes profils, images du dépôt Docker Hub.
          for profile in demo full tiles; do docker compose -f compose.yaml -f compose.hub.yaml --profile "$profile" config -q; done
          # Le fichier Hub est aussi utilisable seul, avec toute son infrastructure.
          for profile in demo infra full monitoring auth tiles; do docker compose -f compose.hub.yaml --profile "$profile" config -q; done
          docker compose -f compose.hub.yaml --profile full --profile monitoring --profile mcp config --format json | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          expected = {"frontend-live", "backend", "simulator", "kafka", "kafka-init", "postgres", "prometheus", "alertmanager", "grafana", "mcp-anomalies"}
          assert expected <= services.keys(), expected - services.keys()
          assert all("build" not in service for service in services.values())
          assert services["backend"]["depends_on"]["postgres"]["condition"] == "service_healthy"
          assert services["backend"]["depends_on"]["kafka-init"]["condition"] == "service_completed_successfully"
          assert not services["frontend-live"].get("volumes")
          assert not services["backend"].get("volumes")
          assert services["backend"]["environment"]["ASSIGNMENT_GRAPH_FILE"] == "/app/bundled-graph/graph.json"
          '
          # Le serveur MCP s'appuie sur le Kafka du profil « full ».
          docker compose --profile full --profile mcp config -q
          docker compose -f compose.yaml -f compose.hub.yaml --profile full --profile mcp config -q
      - name: Image cartographique autonome
        uses: docker/build-push-action@v7
        with:
          context: .
          file: cartographie/Dockerfile
          load: true
          tags: autoroutes-cartographie:smoke
          cache-from: type=gha,scope=cartographie
      - name: Scripts cartographiques sans montage du dépôt
        run: |
          docker run --rm --network none --entrypoint bash autoroutes-cartographie:smoke -ec '
            test -s "$REPO/cartographie/build.sh"
            test -s "$REPO/cartographie/prepare_motorways.py"
            test -s "$REPO/referentiel/gares-logiques-proposition.csv"
            test -s "$REPO/echangeurs-rrnc-2025.csv"
            bash -n "$REPO/cartographie/build.sh"
          '
      - name: Image backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: with-map
          build-contexts: cartography=./cartographie/out
          load: true
          tags: autoroutes-backend:smoke
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Image simulateur
        uses: docker/build-push-action@v7
        with:
          context: .
          file: simulator/Dockerfile
          push: false
          cache-from: type=gha,scope=simulator
          cache-to: type=gha,scope=simulator,mode=max
      - name: Image serveur MCP
        uses: docker/build-push-action@v7
        with:
          context: .
          file: mcp-anomalies/Dockerfile
          push: false
          cache-from: type=gha,scope=mcp-anomalies
          cache-to: type=gha,scope=mcp-anomalies,mode=max
      - name: Image frontend (démonstration)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          build-args: MODE=demo
          push: false
          cache-from: type=gha,scope=frontend-demo
          cache-to: type=gha,scope=frontend-demo,mode=max
      - name: Image frontend (production avec carte)
        uses: docker/build-push-action@v7
        with:
          context: frontend
          target: with-map
          build-contexts: cartography=./cartographie/out
          load: true
          tags: autoroutes-frontend:smoke
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Carte servie sans volume et graphe embarqué
        run: python3 scripts/verify_bundled_map.py --frontend autoroutes-frontend:smoke --backend autoroutes-backend:smoke --out cartographie/out

  e2e-live:
    name: E2E chaîne complète (simulateur → Kafka → backend → SSE → navigateur) et supervision
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pile complète (profils full, monitoring et mcp, sans tuiles, fond neutre)
        run: |
          GRAFANA_PASSWORD="ci-$(openssl rand -hex 8)"
          echo "GRAFANA_PASSWORD=$GRAFANA_PASSWORD" >> "$GITHUB_ENV"
          {
            echo "COMPOSE_PROFILES=full,monitoring,mcp"
            echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)"
            echo "GRAFANA_PASSWORD=$GRAFANA_PASSWORD"
            # Exigés par Compose pour tous les profils (interpolation de tout le fichier), inutilisés sans le profil auth.
            echo "KEYCLOAK_ADMIN_PASSWORD=unused"
            echo "SUPERVISION_CLIENT_SECRET=unused"
            echo "KEYCLOAK_VIEWER_PASSWORD=unused"
            echo "KEYCLOAK_ADMIN_USER_PASSWORD=unused"
            echo "SIMULATOR_RATE=80"
            echo "VITE_BASEMAP_URL="
            echo "VITE_MOTORWAYS_URL="
            echo "VITE_GLYPHS_URL="
            echo "VITE_SPRITE_URL="
          } > .env
          mkdir -p cartographie/out/tiles cartographie/out/basemaps-assets
          docker compose up -d --build
      - name: Attente du backend, du serveur MCP et du frontend
        run: |
          for i in $(seq 1 90); do
            if [ "$(docker compose ps backend --format '{{.Health}}')" = "healthy" ] \
               && [ "$(docker compose ps mcp-anomalies --format '{{.Health}}')" = "healthy" ] \
               && curl -fsS -o /dev/null http://localhost:8080/healthz; then
              echo "prêt après ${i} tentatives"; exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          exit 1
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # 4 scénarios : données réelles sans bandeau simulé, latence p95 ≤ 3 s, relecture puis retour au direct, courbe J-7.
      # Puis un agent (client MCP) déclare une anomalie, la voit dans la fiche avec sa source, puis la lève.
      - name: E2E chaîne réelle et agent MCP
        working-directory: frontend
        env:
          E2E_LIVE: "1"
          E2E_AGENT: "1"
          E2E_BASE_URL: http://localhost:8080
          MCP_URL: http://localhost:8090/mcp
        run: npx playwright test e2e/live.spec.ts e2e/agent.spec.ts
      # Prometheus : cibles saines, 14 règles chargées ; Grafana : tableau de bord provisionné ; chaque panneau reçoit des données.
      - name: Supervision de bout en bout
        run: python3 scripts/verify_observability.py --timeout 300
      - name: Journaux des services
        if: failure()
        run: docker compose logs --no-color --tail=300 > compose-logs.txt || true
      - name: Artefacts de diagnostic
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-live
          path: |
            compose-logs.txt
            frontend/test-results
          retention-days: 7
      - name: Arrêt de la pile
        if: always()
        run: docker compose down -v

  e2e-auth:
    name: E2E authentification OIDC (navigateur → nginx → backend → Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pile avec connexion obligatoire (profils full, auth et mcp sécurisé)
        run: |
          VIEWER_PASSWORD="ci-$(openssl rand -hex 8)"
          ADMIN_PASSWORD="ci-$(openssl rand -hex 8)"
          echo "E2E_VIEWER_PASSWORD=$VIEWER_PASSWORD" >> "$GITHUB_ENV"
          echo "E2E_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          {
            AGENT_SECRET="ci-$(openssl rand -hex 16)"
            echo "E2E_AGENT_CLIENT_SECRET=$AGENT_SECRET" >> "$GITHUB_ENV"
            echo "COMPOSE_PROFILES=full,auth,mcp"
            echo "SUPERVISION_PROFILE=auth"
            echo "MCP_SECURITY_ENABLED=true"
            echo "MCP_AGENT_CLIENT_SECRET=$AGENT_SECRET"
            echo "POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)"
            echo "GRAFANA_PASSWORD=ci-$(openssl rand -hex 8)"
            echo "KEYCLOAK_ADMIN_PASSWORD=ci-$(openssl rand -hex 8)"
            echo "SUPERVISION_CLIENT_SECRET=ci-$(openssl rand -hex 16)"
            echo "KEYCLOAK_VIEWER_PASSWORD=$VIEWER_PASSWORD"
            echo "KEYCLOAK_ADMIN_USER_PASSWORD=$ADMIN_PASSWORD"
            echo "SIMULATOR_RATE=20"
            echo "VITE_BASEMAP_URL="
            echo "VITE_MOTORWAYS_URL="
            echo "VITE_GLYPHS_URL="
            echo "VITE_SPRITE_URL="
          } > .env
          mkdir -p cartographie/out/tiles cartographie/out/basemaps-assets
          docker compose up -d --build
      - name: Attente de Keycloak, du backend et du frontend
        run: |
          for i in $(seq 1 120); do
            if [ "$(docker compose ps keycloak --format '{{.Health}}')" = "healthy" ] \
               && [ "$(docker compose ps backend --format '{{.Health}}')" = "healthy" ] \
               && [ "$(docker compose ps mcp-anomalies --format '{{.Health}}')" = "healthy" ] \
               && curl -fsS -o /dev/null http://localhost:8080/healthz; then
              echo "prêt après ${i} tentatives"; exit 0
            fi
            sleep 2
          done
          docker compose ps -a
          exit 1
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # 4 scénarios : 401 sans session puis connexion, lecteur refusé en administration, CSRF de l'administrateur, déconnexion.
      # Puis l'agent avec un jeton client credentials : MCP refuse sans jeton, relaie le jeton au backend (chaîne Bearer).
      - name: E2E authentification et agent MCP sécurisé
        working-directory: frontend
        env:
          E2E_AUTH: "1"
          E2E_AGENT: "1"
          E2E_BASE_URL: http://localhost:8080
          MCP_URL: http://localhost:8090/mcp
          E2E_AGENT_TOKEN_URL: http://localhost:8180/realms/supervision/protocol/openid-connect/token
        run: npx playwright test e2e/auth.spec.ts e2e/agent.spec.ts
      - name: Journaux des services
        if: failure()
        run: docker compose logs --no-color --tail=300 > compose-logs.txt || true
      - name: Artefacts de diagnostic
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-auth
          path: |
            compose-logs.txt
            frontend/test-results
          retention-days: 7
      - name: Arrêt de la pile
        if: always()
        run: docker compose down -v

  # Point d'entrée unique pour la protection de branche : « CI réussie ».
  ci-ok:
    name: CI réussie
    if: always()
    needs: [backend, simulator, mcp, frontend, visuel, cartographie, carte-images, observabilite, shell, docker, e2e-live, e2e-auth]
    runs-on: ubuntu-latest
    steps:
      - name: Tous les jobs sont verts
        run: |
          echo '${{ toJSON(needs) }}' | python3 -c '
          import json, sys
          needs = json.load(sys.stdin)
          bad = {name: job["result"] for name, job in needs.items() if job["result"] != "success"}
          print(json.dumps(bad) if bad else "tous les jobs sont en succès")
          sys.exit(1 if bad else 0)'

  # Publication sur Docker Hub (dépôt unique compagnonsdudev/autoroutes, une famille de tags par image : backend-, simulator-,
  # mcp-anomalies-, frontend-, frontend-demo-, cartographie-). Seulement après « CI réussie », jamais sur une pull request ni sur une autre branche que main.
  #   main      → <image>-edge et <image>-sha-<7 caractères>
  #   v1.2.3    → <image>-1.2.3, <image>-1.2 et <image>-latest
  # Secrets du dépôt à définir : DOCKERHUB_USERNAME et DOCKERHUB_TOKEN (jeton d'accès Docker Hub avec écriture sur le dépôt).
  publication:
    name: Publication Docker Hub (${{ matrix.image }})
    needs: [ci-ok]
    if: ${{ github.event_name != 'pull_request' && needs.ci-ok.result == 'success' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      REPOSITORY: compagnonsdudev/autoroutes
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            target: with-map
            build-contexts: cartography=./cartographie/out
            context: .
            file: backend/Dockerfile
            platforms: linux/amd64,linux/arm64
            build-args: ""
          - image: simulator
            context: .
            file: simulator/Dockerfile
            platforms: linux/amd64,linux/arm64
            build-args: ""
          - image: mcp-anomalies
            context: .
            file: mcp-anomalies/Dockerfile
            platforms: linux/amd64,linux/arm64
            build-args: ""
          # Interface de production : tuiles et polices servies par la même origine (valeurs par défaut du Dockerfile).
          - image: frontend
            target: with-map
            build-contexts: cartography=./cartographie/out
            context: frontend
            file: frontend/Dockerfile
            platforms: linux/amd64,linux/arm64
            build-args: MODE=production
          - image: frontend-demo
            context: frontend
            file: frontend/Dockerfile
            platforms: linux/amd64,linux/arm64
            build-args: MODE=demo
          # Outil de production des tuiles et du graphe : exécuté sur un poste, amd64 suffit.
          - image: cartographie
            context: .
            file: cartographie/Dockerfile
            platforms: linux/amd64
            build-args: ""
    steps:
      - name: Secrets Docker Hub présents
        id: secrets
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "::warning::DOCKERHUB_USERNAME et DOCKERHUB_TOKEN ne sont pas définis : rien n'est publié (voir docs/docker.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.enabled == 'true'
      - name: Carte validée par le job Docker de cette exécution
        if: steps.secrets.outputs.enabled == 'true' && matrix.target == 'with-map'
        uses: actions/download-artifact@v8
        with:
          name: carte-images
          path: cartographie/out
      - uses: docker/setup-qemu-action@v4
        if: steps.secrets.outputs.enabled == 'true'
      - uses: docker/setup-buildx-action@v4
        if: steps.secrets.outputs.enabled == 'true'
      - uses: docker/login-action@v4
        if: steps.secrets.outputs.enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tags et étiquettes
        id: meta
        if: steps.secrets.outputs.enabled == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REPOSITORY }}
          # Un seul dépôt Docker Hub pour toutes les images : le préfixe du tag dit laquelle (backend-1.2.3, frontend-latest…).
          flavor: |
            latest=auto
            prefix=${{ matrix.image }}-,onlatest=true
          tags: |
            type=edge,branch=main
            # Préfixe explicite : celui du type « sha » prime sur le préfixe de `flavor`, et les 5 images écraseraient le même tag.
            type=sha,prefix=${{ matrix.image }}-sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=autoroutes ${{ matrix.image }}
      - name: Construction et publication
        id: push
        if: steps.secrets.outputs.enabled == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-contexts: ${{ matrix.build-contexts }}
          platforms: ${{ matrix.platforms }}
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Récapitulatif
        if: steps.secrets.outputs.enabled == 'true'
        env:
          IMAGE: ${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### ${IMAGE}"
            echo "Empreinte : ${DIGEST}"
            echo
            while IFS= read -r tag; do echo "- ${tag}"; done <<< "$TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
