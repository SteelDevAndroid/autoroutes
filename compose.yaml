# Environnement de développement et de démonstration.
#   docker compose --profile demo up -d                 → frontend en mode démonstration (flux simulé), http://localhost:8080
#   docker compose --profile infra up -d                → Kafka (KRaft) + PostgreSQL pour développer le backend en local
# Les services backend et simulateur s'ajouteront au profil « full » avec l'incrément 1 (voir docs/phase-3-dossier-frontend-industrialisation.md).
name: autoroutes

services:
  frontend:
    profiles: [demo]
    build:
      context: ./frontend
      args:
        MODE: demo
    image: autoroutes-frontend:demo
    ports:
      - "8080:8080"
    # Sorties de cartographie/build.sh ; vides en démonstration hors ligne (fond neutre, sans libellés).
    volumes:
      - ./cartographie/out/tiles:/usr/share/nginx/html/tiles:ro
      - ./cartographie/out/basemaps-assets:/usr/share/nginx/html/basemaps-assets:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /tmp
    restart: unless-stopped

  kafka:
    profiles: [infra]
    image: apache/kafka:4.1.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # ≥ 48 h : le démarrage à froid rejoue depuis minuit (phase 2, Q13).
      KAFKA_LOG_RETENTION_HOURS: 72
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-init:
    profiles: [infra]
    image: apache/kafka:4.1.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic toll-events --partitions 6 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic toll-events.rejected --partitions 3 --replication-factor 1 --config retention.ms=604800000
    restart: "no"

  postgres:
    profiles: [infra]
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: supervision
      POSTGRES_USER: supervision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env (voir .env.example)}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supervision -d supervision"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  kafka-data:
  postgres-data:
